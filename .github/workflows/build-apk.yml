name: Build APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Release APK
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v3
        with:
          name: TV-Release.apk
          path: app/build/outputs/apk/release/app-release.apk
